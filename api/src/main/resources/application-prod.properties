# ---------------------------------------------------------------------------
# Perfil de produção (Render + Aiven). Ativado com SPRING_PROFILES_ACTIVE=prod.
# As credenciais vêm de variáveis de ambiente: NUNCA coloque senhas neste arquivo.
# Se alguma variável faltar, a aplicação falha ao subir (melhor do que subir conectada no banco errado).
# ---------------------------------------------------------------------------

# MySQL na Aiven. A Aiven exige SSL. Ex.:
# DB_URL=jdbc:mysql://HOST.aivencloud.com:PORTA/trocas?sslMode=REQUIRED
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Pool de conexões pequeno: o plano gratuito tem pouca memória e a Aiven limita o número de conexões
spring.datasource.hikari.maximum-pool-size=5

# Console do H2 desligado em produção (deixá-lo exposto é uma falha de segurança)
spring.h2.console.enabled=false

# A API roda atrás do proxy HTTPS do Render: usa os cabeçalhos X-Forwarded-* para montar URLs corretas
# (ex.: header Location com https://...onrender.com em vez de http://localhost:10000)
server.forward-headers-strategy=framework
