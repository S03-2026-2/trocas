spring.application.name=trocas

# Porta HTTP: o Render informa a porta pela variável PORT; localmente usa 8080
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Banco padrão (desenvolvimento e testes): H2 em memória, zera a cada reinício.
# Em modo MySQL para se comportar como o banco de produção (ver application-prod.properties).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:trocas;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Console do H2 para inspecionar o banco: http://localhost:8080/h2-console (JDBC URL acima)
spring.h2.console.enabled=true

# Esquema do banco: criado pelas migrações do Flyway (src/main/resources/db/migration).
# O Hibernate só confere se as entidades batem com as tabelas; se não baterem, a aplicação não sobe.
spring.jpa.hibernate.ddl-auto=validate

# Evita consultas ao banco durante a serialização do JSON (a camada de DTOs já resolve isso)
spring.jpa.open-in-view=false

# Paginação: ?page=1 é a primeira página, tamanho via ?perPage=, no máximo 100 por página
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.size-parameter=perPage
spring.data.web.pageable.max-page-size=100

# Actuator: expõe só o /actuator/health (usado pelo health check do Render)
management.endpoints.web.exposure.include=health

# CORS: origens (front-ends) que podem chamar a API pelo navegador, separadas por vírgula.
# Ex.: CORS_ALLOWED_ORIGINS=https://meu-front.onrender.com,http://localhost:5173
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Broker de eventos: endereço para onde a API publica o evento de troca realizada.
# Vem da variável BROKER_URL; sem ela, usa o padrão abaixo (para a API subir e os testes rodarem).
# Ex.: BROKER_URL=https://broker-do-outro-time.onrender.com
broker.url=${BROKER_URL:http://localhost:8000}
