spring.application.name=trocas

# Banco H2 em memória (zera a cada reinício)
spring.datasource.url=jdbc:h2:mem:trocas
spring.datasource.username=sa
spring.datasource.password=

# Console do H2 para inspecionar o banco: http://localhost:8080/h2-console (JDBC URL acima)
spring.h2.console.enabled=true

# Paginação: ?page=1 é a primeira página, tamanho via ?perPage=, no máximo 100 por página
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.size-parameter=perPage
spring.data.web.pageable.max-page-size=100

# Evita consultas ao banco durante a serialização do JSON (a camada de DTOs já resolve isso)
spring.jpa.open-in-view=false
